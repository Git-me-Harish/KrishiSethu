# Alembic configuration for KrishiSetu
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = alembic

# Database URL — overridden by env.py to read from app settings
sqlalchemy.url = postgresql+asyncpg://krishisetu:krishisetu_dev_password@localhost:5432/krishisetu

# Template for migration file names
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in file_template
timezone = UTC

# Truncate long slugs in file names
truncate_slug_length = 40

# Set to true to output SQL directly instead of running it (debugging)
# sqlalchemy.url is set dynamically in env.py based on app settings

[post_write_hooks]
# Run ruff format on generated migration files
hooks = ruff_format ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
