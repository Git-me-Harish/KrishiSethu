# KrishiSetu production nginx configuration — security headers + TLS hardening.
#
# This file is intended to be used as a snippet included inside a server { }
# block. It applies all Phase F security headers at the edge (in addition to
# the API's own SecurityHeadersMiddleware, which acts as a backstop).
#
# Usage (in your server block):
#   include /etc/nginx/snippets/krishisetu-security.conf;
#
# Tested with nginx 1.24+ and nginx 1.26+.

# ---------------------------------------------------------------------------
# TLS hardening (modern, supports Firefox 63+, Chrome 70+, Safari 12.1+)
# ---------------------------------------------------------------------------
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling — speeds up client cert validation + improves privacy
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# ---------------------------------------------------------------------------
# Security headers (applied to every response)
# ---------------------------------------------------------------------------
# Content-Security-Policy — strict for the Next.js frontend.
#
# script-src: 'unsafe-eval' is REMOVED. Next.js only needs eval() in the dev
# server (React Refresh); a production `next build` does not. Combined with
# auth tokens in localStorage, leaving it on turned any injection into durable
# account takeover.
#
# STILL PRESENT — 'unsafe-inline' in script-src. The Next.js App Router emits
# inline bootstrap / flight-payload <script> tags on every SSR response, so
# removing it breaks hydration outright. The correct fix is per-request
# nonces: generate a nonce in nginx (njs/openresty), pass it to Next via a
# request header, render `nonce={...}` on the app's scripts, then replace
# 'unsafe-inline' with 'nonce-$...' and add 'strict-dynamic' here. That needs
# an apps/web change, so it is deliberately left as follow-up work.
#
# 'unsafe-inline' in style-src is retained: Next.js injects inline style
# attributes, and inline styles are a far weaker primitive than scripts.
#
# `connect-src` includes the API origin and Google Fonts (if used).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.krishisetu.in wss://api.krishisetu.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri /api/v1/security/csp-report" always;

# Strict-Transport-Security — 2 years, include subdomains, preload-ready
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# X-Content-Type-Options — prevent MIME sniffing
add_header X-Content-Type-Options "nosniff" always;

# X-Frame-Options — clickjacking defense (CSP frame-ancestors is modern equiv)
add_header X-Frame-Options "DENY" always;

# Referrer-Policy — limit referrer leakage to cross-origin requests
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Permissions-Policy — disable sensitive client APIs by default
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), payment=()" always;

# Cross-Origin isolation
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# X-DNS-Prefetch-Control — disable DNS prefetch
add_header X-DNS-Prefetch-Control "off" always;

# ---------------------------------------------------------------------------
# Hide server version
# ---------------------------------------------------------------------------
server_tokens off;
more_clear_headers 'Server';
more_clear_headers 'X-Powered-By';

# ---------------------------------------------------------------------------
# Rate limiting zones (define at http {} level — moved here as reference)
# ---------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
# limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=api_ml:10m rate=20r/m;

# ---------------------------------------------------------------------------
# Request body size limit (matches MAX_REQUEST_BODY_BYTES in API)
# ---------------------------------------------------------------------------
client_max_body_size 15m;

# ---------------------------------------------------------------------------
# Gzip — applied to JSON responses > 1KB
# ---------------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
  application/json
  application/javascript
  application/xml
  text/css
  text/plain
  text/xml;

# ---------------------------------------------------------------------------
# Bot mitigation — block obvious scanners
# ---------------------------------------------------------------------------
# Bad User-Agent strings (common attack tools)
if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|wpscan|dirbuster|gobuster|hydra|metasploit)) {
    return 403;
}

# NOTE: an "empty User-Agent => 403" rule used to live here. It was removed:
# it blocked legitimate curl, mobile SDK and health-probe clients while
# stopping no real attacker (any scanner can set a User-Agent in one flag),
# so it was pure breakage for zero security benefit.
