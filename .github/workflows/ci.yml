name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend (Python / FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend Lint + Type Check + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: krishisetu_test
          POSTGRES_USER: krishisetu
          POSTGRES_PASSWORD: krishisetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krishisetu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install uv
        run: pip install uv

      - name: Create venv and install dependencies
        run: |
          uv venv .venv
          UV_PROJECT_ENVIRONMENT=.venv uv pip install -e ".[dev]"

      - name: Lint with ruff
        run: .venv/bin/ruff check .

      - name: Format check with ruff
        run: .venv/bin/ruff format --check .

      - name: Type check with mypy
        run: .venv/bin/mypy krishisetu/

      - name: Security scan with bandit
        run: .venv/bin/pip install bandit && .venv/bin/bandit -r krishisetu/ -ll

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://krishisetu:krishisetu_test@localhost:5432/krishisetu_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
        run: .venv/bin/alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://krishisetu:krishisetu_test@localhost:5432/krishisetu_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          ENV: development
        run: .venv/bin/pytest

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend Lint + Type Check + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test --run

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  # ---------------------------------------------------------------------------
  # Docker Build Verification
  # ---------------------------------------------------------------------------
  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t krishisetu-api:test ./apps/api

      - name: Build Web image
        run: docker build -t krishisetu-web:test ./apps/web
