# KrishiSetu security CI workflow.
#
# Runs on every push to main/develop and every pull request. Also runs
# nightly on the main branch to catch newly-disclosed CVEs.
#
# Jobs:
#   1. python-bandit      — AST-based security lint on the API
#   2. python-pip-audit   — Python dependency vulnerability scan
#   3. js-npm-audit       — JS dependency vulnerability scan
#   4. typecheck          — TypeScript strict type check
#   5. zap-baseline       — runtime HTTP scan (only on PRs that touch API)
#   6. docker-trivy       — Docker image scan (only on main branch)
#
# A failure in any blocking job blocks the merge. The zap and trivy jobs
# are non-blocking on develop (warning-only) to allow iteration.

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 2:30 AM IST (21:00 UTC previous day)
    - cron: '30 21 * * *'

permissions:
  contents: read
  security-events: write  # for SARIF upload

jobs:
  # ---------------------------------------------------------------------------
  # Python: Bandit + pip-audit
  # ---------------------------------------------------------------------------
  python-security:
    name: Python (Bandit + pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install security tools
        run: pip install bandit pip-audit safety

      # Bandit must be able to fail the job. The SARIF upload is a separate
      # `if: always()` step so findings still reach code scanning on failure.
      - name: Bandit (AST security lint)
        run: bandit -r krishisetu -ll -ii -f sarif -o bandit-results.sarif

      # pip-audit cannot parse a pyproject.toml via --requirement (that flag
      # expects a requirements.txt). Project mode resolves the dependencies
      # declared in pyproject.toml instead.
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --strict .

      - name: Safety (additional CVE check)
        run: safety check

      - name: Upload Bandit SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/api/bandit-results.sarif
          category: bandit

  # ---------------------------------------------------------------------------
  # JavaScript: npm audit
  # ---------------------------------------------------------------------------
  js-security:
    name: JavaScript (pnpm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # The repo is pnpm-only: apps/web/pnpm-lock.yaml is tracked and there is
      # no package-lock.json, so the previous `npm ci` job never ran the audit.
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (HIGH and CRITICAL)
        run: pnpm audit --prod --audit-level=high

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

  # ---------------------------------------------------------------------------
  # OWASP ZAP baseline scan (only on PRs that touch the API)
  # ---------------------------------------------------------------------------
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [python-security]
    steps:
      - uses: actions/checkout@v4

      - name: Start API
        working-directory: apps/api
        # docker-compose.yml now refuses to start without these (see findings
        # on hardcoded JWT secret / unauthenticated redis + ml-inference).
        # Ephemeral CI-only values; nothing here reaches a real environment.
        env:
          JWT_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-jwt-secret
          ML_SERVICE_TOKEN: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-ml-token
          REDIS_PASSWORD: ci-only-${{ github.run_id }}-redis
        run: |
          docker compose -f ../../infra/docker-compose.yml up -d postgres redis minio
          sleep 10
          docker compose -f ../../infra/docker-compose.yml up -d api
          sleep 15

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'http://localhost:8000/api/v1/health'
          cmd_options: '-c infra/security/zap-rules.tsv -I'
          allow_issue_writing: false
          fail_action: true

      - name: Teardown
        if: always()
        working-directory: apps/api
        env:
          JWT_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-jwt-secret
          ML_SERVICE_TOKEN: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-ml-token
          REDIS_PASSWORD: ci-only-${{ github.run_id }}-redis
        run: docker compose -f ../../infra/docker-compose.yml down -v

  # ---------------------------------------------------------------------------
  # Trivy Docker image scan (only on main branch + nightly)
  # ---------------------------------------------------------------------------
  docker-trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    needs: [python-security]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        working-directory: apps/api
        run: docker build -t krishisetu-api:ci .

      - name: Trivy scan (HIGH and CRITICAL)
        # Pinned to a commit SHA: @master is a mutable third-party ref and this
        # job runs with security-events: write.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: krishisetu-api:ci
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ---------------------------------------------------------------------------
  # Ruff + mypy (general lint + type check) — non-blocking on develop
  # ---------------------------------------------------------------------------
  python-lint:
    name: Python (Ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check krishisetu

      # NOT yet blocking: mypy runs in strict mode against a codebase that has
      # never been type-clean, so gating it here would block every PR until a
      # separate typing cleanup lands. Track that work before flipping this.
      - name: mypy
        run: mypy krishisetu
        continue-on-error: true
